<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TxtParser Demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <script type="importmap">
      {
        "imports": {
          "@hamster-note/document-parser": "https://esm.sh/@hamster-note/document-parser@0.3.1",
          "@hamster-note/types": "https://esm.sh/@hamster-note/types@0.8.0",
          "vconsole": "https://esm.sh/vconsole@3.15.1"
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>TxtParser Demo</h1>
      <label for="source-input">Source text</label>
      <textarea
        id="source-input"
        data-role="source-input"
        placeholder="Enter text here..."
      ></textarea>

      <div class="buttons">
        <button type="button" data-action="inspect">Inspect</button>
        <button type="button" data-action="encode">Encode</button>
        <button type="button" data-action="decode" disabled>Decode</button>
      </div>

      <div class="status" data-role="status" role="status" aria-live="polite">
        Idle
      </div>
      <div class="summary" data-role="summary" aria-live="polite">
        Enter text, then inspect or encode it.
      </div>

      <section class="output-section" aria-labelledby="inspection-heading">
        <h3 id="inspection-heading">Inspection Output</h3>
        <pre data-role="inspection-output"></pre>
      </section>

      <section class="output-section" aria-labelledby="document-heading">
        <h3 id="document-heading">Document Output</h3>
        <pre data-role="document-output"></pre>
      </section>

      <section class="output-section" aria-labelledby="paragraphs-heading">
        <h3 id="paragraphs-heading">Paragraph Details</h3>
        <pre data-role="paragraphs-output"></pre>
      </section>

      <section class="output-section" aria-labelledby="decode-heading">
        <h3 id="decode-heading">Decode Output</h3>
        <pre data-role="decode-output"></pre>
      </section>
    </div>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
